packages:
  - apps/*
  - packages/*
# Native deps that must NOT run install scripts: argon2 loads its platform
# prebuilt binary at runtime via node-gyp-build, so no toolchain is needed
# and lifecycle scripts stay off.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  argon2: false
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

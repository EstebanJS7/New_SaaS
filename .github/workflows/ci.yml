name: CI

# Repository policy: the `Lint, Typecheck, Test, Build` check below (job ID
# `quality`) and the `Database migrations` check (job ID `migrations`) must be
# configured as required status checks in the default branch protection rule so
# that CI failures block merge. The workflow itself defines the gates;
# enforcement is a repository-admin setting documented in
# docs/10-qa/CI-EVIDENCE.md.

on:
  push:
    branches: [main, master]
  pull_request:
    # Required checks run for pull requests targeting the default branches.
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsaas_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsaas_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to a fresh database
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm db:deploy

      - name: Seed reference data twice with count-equality probe
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: |
          pnpm db:seed
          FIRST_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after first seed: $FIRST_COUNTS"
          pnpm db:seed
          SECOND_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after second seed: $SECOND_COUNTS"
          test "$FIRST_COUNTS" = "$SECOND_COUNTS"

      - name: Live PostgreSQL migration verification
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm db:live-verify

      - name: Build workspace packages for live-PG test
        # Turbo respects the workspace dependency graph so @newsaas/config,
        # @newsaas/shared and @newsaas/database are built before the API.
        run: pnpm build --filter=@newsaas/api

      - name: Live PostgreSQL application-path isolation evidence
        working-directory: apps/api
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/newsaas_migrations
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm test:live-pg

  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  xsd-validation:
    # FISC-008 WU-B. The acceptance criterion is "a DTE XML validates against the
    # official XSD before any submission". The schemas are copyrighted and are
    # NOT vendored, so this job fetches the seven official artifacts into a
    # job-local directory that is never committed and never cached across runs,
    # asserts every one of them, and then runs the schema-validation suite with
    # its skip DISABLED. A fetch that does not produce all seven fails the job
    # rather than degrading to a skip, so a green run can never be the product
    # of having validated nothing.
    name: DTE XSD validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the fiscal package
        run: pnpm build --filter=@newsaas/fiscal

      - name: Fetch and assert the official DNIT schemas
        # Fails unless all seven artifacts arrive with a 200 and a plausible
        # size, and rewrites their absolute includes so the next step is
        # hermetic.
        env:
          # Job-local, outside the workspace: never committed, never cached.
          DTE_XSD_DIR: ${{ runner.temp }}/dte-xsd
        run: pnpm --filter @newsaas/fiscal fetch:dte-schemas

      - name: Validate the built DE against the official schemas
        env:
          DTE_XSD_DIR: ${{ runner.temp }}/dte-xsd
          DTE_XSD_REQUIRED: "1"
        run: pnpm --filter @newsaas/fiscal test

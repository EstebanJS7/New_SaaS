name: CI

# Repository policy: the `Lint, Typecheck, Test, Build` check below (job ID
# `quality`) and the `Database migrations` check (job ID `migrations`) must be
# configured as required status checks in the default branch protection rule so
# that CI failures block merge. The workflow itself defines the gates;
# enforcement is a repository-admin setting documented in
# docs/10-qa/CI-EVIDENCE.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsaas_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsaas_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to a fresh database
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm db:deploy

      - name: Seed reference data twice with count-equality probe
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: |
          pnpm db:seed
          FIRST_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after first seed: $FIRST_COUNTS"
          pnpm db:seed
          SECOND_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after second seed: $SECOND_COUNTS"
          test "$FIRST_COUNTS" = "$SECOND_COUNTS"

  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

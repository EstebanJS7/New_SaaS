name: CI

# Repository policy: the `Lint, Typecheck, Test, Build` check below (job ID
# `quality`) and the `Database migrations` check (job ID `migrations`) must be
# configured as required status checks in the default branch protection rule so
# that CI failures block merge. The workflow itself defines the gates;
# enforcement is a repository-admin setting documented in
# docs/10-qa/CI-EVIDENCE.md.

on:
  push:
    branches: [main, master]
  pull_request:
    # Required checks run for pull requests targeting the default branches.
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsaas_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsaas_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to a fresh database
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm db:deploy

      - name: Seed reference data twice with count-equality probe
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: |
          pnpm db:seed
          FIRST_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after first seed: $FIRST_COUNTS"
          pnpm db:seed
          SECOND_COUNTS=$(node scripts/ci-seed-counts.mjs)
          echo "counts after second seed: $SECOND_COUNTS"
          test "$FIRST_COUNTS" = "$SECOND_COUNTS"

      - name: Live PostgreSQL migration verification
        working-directory: packages/database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm db:live-verify

      - name: Build workspace packages for live-PG test
        # Turbo respects the workspace dependency graph so @newsaas/config,
        # @newsaas/shared and @newsaas/database are built before the API.
        run: pnpm build --filter=@newsaas/api

      - name: Live PostgreSQL application-path isolation evidence
        working-directory: apps/api
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/newsaas_migrations
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
        run: pnpm test:live-pg

  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format-check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    # The browser lane (apps/e2e). It is the only job that drives the BUILT apps through a real
    # browser, which is the only way to catch the class of defect this repository kept finding by hand:
    # a page that does not exist, a proxy that answers 500, a form that renders and does not submit.
    # Three such defects were found by looking or by a hand-run curl, and none by a test.
    #
    # It is a separate job on purpose: a browser test is slower and flakier than a unit test, and the
    # fast `quality` job must not wait on it or fail because of it.
    name: Browser end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsaas_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newsaas_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        # `--with-deps` installs the system libraries Chromium needs. It is the reason this job cannot
        # simply run the lane's npm script: the browser is a deployment-time concern of the runner.
        run: pnpm --filter @newsaas/e2e exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run the lane
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsaas_migrations
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @newsaas/e2e e2e

      - name: Upload the report and traces
        # A trace on failure is the whole reason a browser test is worth having: it is the recording of
        # what the browser actually saw. Keeping it only on failure keeps the artefacts meaningful.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  xsd-validation:
    # FISC-008 WU-B. The acceptance criterion is "a DTE XML validates against the
    # official XSD before any submission". The schemas are copyrighted and are
    # NOT vendored, so this job fetches the eleven official artifacts (the DE's
    # seven plus the event family's four, FISC-016 WU-C) into a
    # job-local directory that is never committed and never cached across runs,
    # asserts every one of them, and then runs the schema-validation suites -- the
    # DE's and the event family's -- with
    # its skip DISABLED. A fetch that does not produce all seven fails the job
    # rather than degrading to a skip, so a green run can never be the product
    # of having validated nothing.
    name: DTE XSD validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the fiscal package
        run: pnpm build --filter=@newsaas/fiscal

      - name: Fetch and assert the official DNIT schemas
        # Fails unless all eleven artifacts arrive with a 200 and a plausible
        # size, and rewrites their absolute includes so the next step is
        # hermetic.
        env:
          # Job-local, outside the workspace: never committed, never cached.
          DTE_XSD_DIR: ${{ runner.temp }}/dte-xsd
        run: pnpm --filter @newsaas/fiscal fetch:dte-schemas

      - name: Validate the built DE against the official schemas
        env:
          DTE_XSD_DIR: ${{ runner.temp }}/dte-xsd
          DTE_XSD_REQUIRED: "1"
        run: pnpm --filter @newsaas/fiscal test
